name: Refresh live data
on:
  schedule:
    - cron: "7 * * * *"   # hourly: air quality and the Bicing fallback snapshot
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 src/bicing.py . && python3 src/air.py .
      - run: |
          git config user.name "bcn3d-bot"
          git config user.email "bcn3d-bot@users.noreply.github.com"
          git add data/bicing.json data/air.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Bicing and air quality"
          git pull --rebase origin main && git push
