name: Refresh traffic
on:
  schedule:
    - cron: "*/10 * * * *"   # Open Data BCN updates traffic every 5 min; GitHub runs this every ~10
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the portal answers from here
        run: curl -s -o /dev/null -w "package_show %{http_code}\n" "https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=trams"
      - name: Download traffic state
        env:
          OPENDATA_BCN_TOKEN: ${{ secrets.OPEN_DATA_TOKEN }}
        run: python3 src/traffic.py .
      - run: |
          git config user.name "bcn3d-bot"
          git config user.email "bcn3d-bot@users.noreply.github.com"
          git add data/traffic.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh traffic"
          git pull --rebase origin main && git push
