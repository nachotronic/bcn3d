/* Layout: full-bleed map; one floating panel top-left (title, views, legend); language pills top-right. */
:root {
  --bg: #e9e4da;          /* sandstone ground, like Montjuïc stone */
  --panel: rgba(250, 247, 241, 0.92);
  --fg: #1f2a33;
  --muted: #5d6870;
  --line: rgba(31, 42, 51, 0.14);
  --accent: #c2410c;      /* trencadís terracotta */
  --sea: #9fc3d4;
  --park: #c7d3a8;
  --street: #f8f5ef;
  --b0: #f1e6d0; --b1: #e7c99a; --b2: #d99a5e; --b3: #b9603a; --b4: #7a2e2a;
  --stone: #d8c7a3;
  --tree: #4f8a3c; --signal: #b8322a; --charge: #2563eb; --park-p: #3b5ba9; --water: #1597b8; --bus: #c8102e;  /* modelled landmarks (Montjuïc sandstone) */
  --q0: #ffffd9; --q1: #c7e9b4; --q2: #41b6c4; --q3: #225ea8; --q4: #0c2c84;  /* data by census section */
  --ok: #2f8f4e; --low: #d99a1e; --empty: #c0392b; --ring: #ffffff;  /* Bicing availability */
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b21; --panel: rgba(24, 30, 37, 0.9); --fg: #ece7de; --muted: #9aa4ab; --line: rgba(236, 231, 222, 0.14);
  --accent: #f08a4b; --sea: #1d3a4a; --park: #26352a; --street: #2a3139;
  --b0: #3a3f47; --b1: #5f5a55; --b2: #9a6b48; --b3: #d0844c; --b4: #f2b46c;
  --ok: #4cc271; --low: #f0b43c; --empty: #ef5b4c; --ring: #161b21; --stone: #8c7b5c; --tree: #5fa04a; --signal: #ef5b4c; --charge: #60a5fa; --park-p: #8aa4e8; --water: #4cc3e0; --bus: #ff5a6e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161b21; --panel: rgba(24, 30, 37, 0.9); --fg: #ece7de; --muted: #9aa4ab; --line: rgba(236, 231, 222, 0.14);
  --accent: #f08a4b; --sea: #1d3a4a; --park: #26352a; --street: #2a3139;
  --b0: #3a3f47; --b1: #5f5a55; --b2: #9a6b48; --b3: #d0844c; --b4: #f2b46c;
  --ok: #4cc271; --low: #f0b43c; --empty: #ef5b4c; --ring: #161b21; --stone: #8c7b5c; --tree: #5fa04a; --signal: #ef5b4c; --charge: #60a5fa; --park-p: #8aa4e8; --water: #4cc3e0; --bus: #ff5a6e; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
#map { position: absolute; inset: 0; }
.maplibregl-ctrl-attrib { font-family: var(--font-body); }

.panel {
  position: absolute; z-index: 2;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100vw - 32px)); max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
.panel header { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; }
.panel header .sub { grid-column: 1 / -1; }
.collapse { display: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--fg);
  font-size: 1rem; line-height: 1; cursor: pointer; transition: transform .2s; }
.panel.min .collapse { transform: rotate(180deg); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; line-height: 1.05; text-wrap: balance; letter-spacing: -0.01em; }
h1 em { font-style: normal; color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
.label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.views button, .lang button, .tog {
  font: 500 0.82rem var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 10px; cursor: pointer;
}
.views button:hover, .lang button:hover, .tog:hover { border-color: var(--accent); }
.views button[aria-pressed="true"], .lang button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.legend { display: grid; gap: 4px; }
.ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--b0), var(--b1), var(--b2), var(--b3), var(--b4)); }
.ticks { display: flex; justify-content: space-between; font: 0.72rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stats { font: 0.75rem var(--font-mono); color: var(--muted); margin: 0; display: grid; gap: 2px; }
.layers { display: flex; flex-wrap: wrap; gap: 6px; }
.layers button { font: 500 0.82rem var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 10px 5px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.layers button::before { content: ""; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--muted); }
.layers button[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }
.layers button:hover { border-color: var(--accent); }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
.key span { display: inline-flex; align-items: center; gap: 5px; }
.key i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.info .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.info .chips em { font: 600 0.7rem var(--font-body); font-style: normal; color: #fff; padding: 1px 5px; border-radius: 4px; }
.collapse { display: none; }
.ind select { width: 100%; font: 500 0.85rem var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px; }
.ind select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ind .ramp2 { height: 8px; border-radius: 4px; margin-top: 8px; background: linear-gradient(90deg, var(--q0), var(--q1), var(--q2), var(--q3), var(--q4)); }
.ind .parties { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
.ind .parties i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; }
.card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 0.8rem; max-height: 40vh; overflow: auto; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.card dd.hl, .card dt.hl { color: var(--fg); font-weight: 600; }

.lang {
  position: absolute; z-index: 2; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
  top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
}
.lang button { border: 0; padding: 4px 9px; }
.lang.mode { top: calc(52px + env(safe-area-inset-top, 0px)); }

.info {
  position: absolute; z-index: 3; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 0.82rem; display: grid; gap: 2px; max-width: 220px;
}
.info b { font-weight: 600; }
.info span { font-family: var(--font-mono); color: var(--muted); font-size: 0.75rem; }

.card {
  position: absolute; z-index: 4; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(290px, calc(100vw - 32px)); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.16);
}
.card h2 { margin: 0; padding-right: 28px; font: 600 1.05rem/1.2 var(--font-display); text-wrap: balance; }
.card .kind { margin: 0; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.card .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted);
  font-size: 1.3rem; line-height: 1; cursor: pointer; border-radius: 6px; }
.card .x:hover { color: var(--fg); background: var(--line); }
.card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.card .chips em { font: 600 0.8rem var(--font-body); font-style: normal; color: #fff; padding: 2px 7px; border-radius: 5px; }
.card .eta { display: grid; gap: 5px; }
.card .eta div { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 0.85rem; }
.card .eta b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .alert { margin-top: 6px; line-height: 1.35; }
.card .alert em, .card .eta em { font: 600 0.72rem var(--font-body); font-style: normal; color: #fff; padding: 1px 6px; border-radius: 4px; }
.card .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card .nums div { display: grid; gap: 1px; }
.card .nums b { font: 600 1.4rem var(--font-mono); font-variant-numeric: tabular-nums; }
.card .nums span, .card .note { font-size: 0.75rem; color: var(--muted); }
.card .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.card .bar i { display: block; height: 100%; }
.card .note { margin: 0; }
.chip-load { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 0.78rem; color: var(--muted); pointer-events: none; }
.poi { font: 600 0.75rem var(--font-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  padding: 3px 8px; border-radius: 999px; white-space: nowrap; transform: translateY(-6px); cursor: pointer; }
.poi::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 1px; height: 6px; background: var(--fg); }

.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; color: var(--muted); font-size: 0.9rem; pointer-events: none; }

@media (max-width: 560px) {
  .panel { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 12px; gap: 10px; max-height: 45%; }
  h1 { font-size: 1.25rem; }
  .sub { display: none; }
  .collapse { display: grid; place-items: center; }
  .panel.min .body { display: none !important; }
  .panel.min { gap: 0; }
}
</style>

</aside>
<div class="info" id="info" hidden></div>

      geometry: { type: 'Point', coordinates: pt(E.o, x, y) } }))) });
    map.addLayer({ id: 'equip', type: 'circle', source: 'equip', minzoom: 12.5, layout: { visibility: shown.equip ? 'visible' : 'none' }, paint: {
      'circle-color': ['match', ['get', 'g'], ...EQ.flatMap((col, i) => [i, col]), EQ[5]], 'circle-stroke-color': c.ring, 'circle-stroke-width': 1.2,
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2.5, 17, 7] } });
  } catch (e) { console.warn('equip', e); }
    // traffic: read live from Open Data BCN in the visitor's browser (the portal refuses cloud servers but allows CORS);
  // inside claude.ai external fetches are blocked, so fall back to a data/traffic.json snapshot if one exists
  const loadTraffic = async () => {
    try {
      if (!tfGeom) {  // street sections ship with the page (data/tramos.json, built by build_tramos.py)
        const G = await (await fetch('data/tramos.json')).json();
        tfGeom = Object.fromEntries(Object.entries(G.t).map(([id, [n, a]]) => [id, { n, p: [Array.from({ length: a.length / 2 }, (_, i) => pt(G.o, a[2 * i], a[2 * i + 1]))] }]));
      }
      const dat = await (await fetch(TF_STATE, { cache: 'no-store' })).text();
      const feats = [];
      dat.split(/\r?\n/).forEach(line => {
        const [id, ts, st, fc] = line.trim().split('#'), g = tfGeom[id];
        if (!g || st === undefined) return;
        if (ts && ts.length >= 12) tfT = `${ts.slice(0, 4)}-${ts.slice(4, 6)}-${ts.slice(6, 8)} ${ts.slice(8, 10)}:${ts.slice(10, 12)}`;
        g.p.forEach(c => feats.push({ type: 'Feature', properties: { s: +st || 0, f: +fc || 0, n: g.n }, geometry: { type: 'LineString', coordinates: c } }));
      });
      if (feats.length) { tfLive = true; return FC(feats); }
    } catch (e) {}
    const D = await (await fetch('data/traffic.json', { cache: 'no-store' })).json(); tfT = D.t;
    return FC(D.s.map(([s, f, n, ...a]) => ({ type: 'Feature', properties: { s, f, n },
      geometry: { type: 'LineString', coordinates: Array.from({ length: a.length / 2 }, (_, i) => pt(D.o, a[2 * i], a[2 * i + 1])) } })));
  };
  try {
    map.addSource('traffic', { type: 'geojson', data: await loadTraffic() });
    map.addLayer({ id: 'traffic', type: 'line', source: 'traffic', layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': ['match', ['get', 's'], ...TF.flatMap((col, i) => [i, col]), TF[0]],
        'line-opacity': ['case', ['==', ['get', 's'], 0], 0.35, 0.9],
        'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 17, 6] } }, 'bldg');
    setInterval(async () => { try { map.getSource('traffic').setData(await loadTraffic()); applyLang(); } catch (e) {} }, 300000);
    applyLang(); setVis();
  } catch (e) { console.warn('traffic', e); }
  try {
    map.addSource('bicing', { type: 'geojson', data: await loadBicing() });
    // live pages (outside claude.ai) refresh Bicing every minute
    if (bkLive) setInterval(async () => { try { map.getSource('bicing').setData(await loadBicing()); applyLang(); } catch (e) {} }, 60000);
    map.addLayer({ id: 'bicing', type: 'circle', source: 'bicing', minzoom: 12.5, paint: {
      'circle-color': bikeColor(c), 'circle-stroke-color': c.ring, 'circle-stroke-width': 1.4,
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 3, 15, 6, 17, ['+', 9, ['/', ['get', 'cap'], 6]]] } });
    addIcons();
    iconLayer('bicing-icon', 'bicing', 'i-bike', 15, ['interpolate', ['linear'], ['zoom'], 15, 0.38, 17, 0.62], '#ffffff');
  } catch (e) { console.warn('bicing', e); }
  setVis(); applyLang();
}
start();
</script>
